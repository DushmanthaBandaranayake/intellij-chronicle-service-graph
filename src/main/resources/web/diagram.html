<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#ffffff; --fg:#222; --link:#9aa3ae; --bar:#eef0f3; --stroke:#8a94a3; --accent:#2f6fde; --hover:#dfe6f3;
          --svc:#eaf1fd; --svc-stroke:#5b84d6; --queue:#eaf7ee; --queue-stroke:#4c9a63; --warn:#d9822b; --warn-bg:#fbeedd; --err:#d64545; --muted:#6b7280; }
  :root.dark { --bg:#2b2d30; --fg:#dfe1e5; --link:#6a7078; --bar:#1e1f22; --stroke:#6f737a; --accent:#4f9cf5; --hover:#2e436e;
               --svc:#26354f; --svc-stroke:#5b84d6; --queue:#233a2c; --queue-stroke:#58a86f; --warn:#e0a050; --warn-bg:#4a3a22; --err:#f06c6c; --muted:#9da3ab; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:12px -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  button, input, select { font:inherit; color:inherit; }

  #bar { flex:none; min-height:30px; box-sizing:border-box; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:3px 8px; background:var(--bar); }
  #bar button { background:var(--bg); border:1px solid var(--stroke); border-radius:4px; padding:3px 7px; cursor:pointer; }
  #bar button:hover { background:var(--hover); }
  #bar button.ico { display:inline-flex; align-items:center; padding:3px 6px; }
  .tools { display:inline-flex; align-items:center; gap:4px; }   /* the buttons sit together, the search box right after */
  #summary { opacity:.75; }
  .legend { margin-left:auto; display:flex; gap:12px; align-items:center; }
  .sw { display:inline-block; width:14px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; border:1px solid; }
  #problems { flex:none; padding:4px 8px; background:var(--warn-bg); border-bottom:1px solid var(--warn); }
  #problems[hidden] { display:none; }

  #main { flex:1; min-height:0; display:flex; }
  #svg { flex:1; min-width:0; height:100%; cursor:grab; user-select:none; }
  #svg.drag { cursor:grabbing; }
  #empty { position:absolute; left:0; right:0; top:45%; text-align:center; opacity:.7; pointer-events:none; }

  .edge { fill:none; stroke:var(--link); stroke-width:1.4; }
  .edge.snap { stroke-dasharray:5 4; }
  .edge.hot { stroke:var(--accent); stroke-width:2.4; }
  .node { cursor:pointer; }
  .node .box { stroke-width:1.3; }
  .node.svc .box { fill:var(--svc); stroke:var(--svc-stroke); }
  .node.queue .box { fill:var(--queue); stroke:var(--queue-stroke); }
  .node.undeclared .box { stroke:var(--warn); stroke-dasharray:5 3; }
  .node:hover .box { stroke-width:2.2; }
  .node.selected .box { stroke:var(--accent); stroke-width:2.8; }
  .node text { fill:var(--fg); pointer-events:none; }
  .node .title { font-weight:600; font-size:12.5px; }
  .node .sub { fill:var(--muted); font-size:11px; }
  .node .sep { stroke:var(--queue-stroke); stroke-opacity:.5; }
  .node .warn { fill:var(--warn); }
  .icon, .lg { fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .icon { pointer-events:none; }
  .lg { width:14px; height:14px; margin-right:4px; vertical-align:-2px; }

  input { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--stroke); border-radius:4px; padding:2px 6px; }
  input:focus { outline:1px solid var(--accent); border-color:var(--accent); }
  #search { width:200px; }
  #count { opacity:.75; min-width:70px; }
  #count.none { color:var(--err); opacity:1; }
  /* !important: these states must win over the service/queue/undeclared colours */
  .node.match .box { fill:#ffd866 !important; stroke:#f5a623 !important; stroke-width:2.4; }
  .node.match text, .node.match .sub { fill:#222 !important; }
  .node.match .icon { color:#7a5a00 !important; }
  .node.current .box { stroke:#e5534b !important; stroke-width:3.2; }

  #focus { display:inline-flex; align-items:center; gap:6px; padding:1px 4px 1px 8px; border-radius:4px;
           background:var(--hover); border:1px solid var(--accent); }
  #focus[hidden] { display:none; }
  #focus button { background:var(--bg); border:1px solid var(--stroke); border-radius:4px; padding:1px 6px; cursor:pointer; }
  .node.root .box { stroke:var(--accent); stroke-width:2.6; stroke-dasharray:none; }

  .seg { display:inline-flex; }
  .seg button { background:var(--bg); border:1px solid var(--stroke); padding:3px 8px; cursor:pointer; margin-left:-1px; }
  .seg button:first-child { border-radius:4px 0 0 4px; margin-left:0; }
  .seg button:last-child { border-radius:0 4px 4px 0; }
  #bar .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .seg button { display:inline-flex; align-items:center; padding:3px 6px; }
  .dir { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round; }

  .qlabel { cursor:pointer; }
  .qlabel rect { fill:var(--queue); stroke:var(--queue-stroke); stroke-width:1; }
  .qlabel .qname { fill:var(--fg); font-size:11.5px; font-weight:600; }
  .qlabel .qsub { fill:var(--muted); font-size:10px; }
  .qlabel .qsub.warn { fill:var(--warn); }
  .qlabel.undeclared rect { stroke:var(--warn); stroke-dasharray:4 2; }
  .qlabel.hot rect, .qlabel.selected rect { stroke:var(--accent); stroke-width:2; }
  .qlabel.match rect { fill:#ffd866; stroke:#f5a623; }
  .qlabel.match text { fill:#222 !important; }

  #menu { position:fixed; z-index:25; min-width:230px; padding:4px; background:var(--bar); border:1px solid var(--stroke);
          border-radius:6px; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  #menu[hidden] { display:none; }
  #menu button { display:block; width:100%; text-align:left; background:none; border:none; border-radius:4px; padding:5px 8px; cursor:pointer; }
  #menu button:hover { background:var(--hover); }
  #menu button small { display:block; opacity:.65; font-size:11px; }
  #menu hr { border:none; border-top:1px solid var(--stroke); margin:4px 2px; }

  #rename { position:fixed; z-index:20; font-weight:600; font-size:12.5px; padding:2px 5px; }
  #toast { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:30; padding:6px 12px; border-radius:5px;
           background:var(--bar); border:1px solid var(--err); color:var(--fg); max-width:70%; pointer-events:none; }
  #toast[hidden] { display:none; }
</style>
</head>
<body>
<div id="bar">
  <span class="tools">
    <button id="refresh" class="ico" title="Refresh from the YAML" aria-label="Refresh from the YAML"><svg class="dir" viewBox="0 0 16 16">
      <path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1"/><path d="M13.6 1.9v3.3h-3.3"/></svg></button>
    <button id="fit" class="ico" title="Fit to window" aria-label="Fit to window"><svg class="dir" viewBox="0 0 16 16">
      <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/><rect x="5.5" y="5.5" width="5" height="5" rx="1"/></svg></button>
    <span class="seg">
      <button data-dir="tb" title="Top to bottom" aria-label="Top to bottom"><svg class="dir" viewBox="0 0 16 16">
        <rect x="4" y="1.5" width="8" height="4" rx="1"/><rect x="4" y="10.5" width="8" height="4" rx="1"/><path d="M8 5.5v4M6.4 8.1L8 9.7l1.6-1.6"/></svg></button><button
        data-dir="lr" title="Left to right" aria-label="Left to right"><svg class="dir" viewBox="0 0 16 16">
        <rect x="1.5" y="4" width="4" height="8" rx="1"/><rect x="10.5" y="4" width="4" height="8" rx="1"/><path d="M5.5 8h4M8.1 6.4L9.7 8l-1.6 1.6"/></svg></button>
    </span>
    <button id="reset" title="Put the nodes you dragged back where the automatic layout puts them" hidden>Reset layout</button>
  </span>
  <input id="search" placeholder="Search (Enter: next, Shift+Enter: previous)" spellcheck="false" title="Matches names, properties and builder settings. Ctrl+F to focus, Esc to clear.">
  <span id="count"></span>
  <span id="focus" hidden><span id="focus-text"></span><button id="show-all" title="Show every service and queue again (Esc)">Show All</button></span>
  <span id="summary"></span>
  <span class="legend" title="Click to find in YAML · Drag to move · Double-click to rename · Right-click for more">
    <span><svg class="lg" viewBox="0 0 16 16" style="color:var(--svc-stroke)"><circle cx="8" cy="8" r="2.2"/><circle cx="8" cy="8" r="4.6"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>service</span>
    <span><svg class="lg" viewBox="0 0 16 16" style="color:var(--queue-stroke)"><ellipse cx="3.5" cy="8" rx="1.8" ry="4"/><path d="M3.5 4h9c1 0 1.8 1.8 1.8 4s-.8 4-1.8 4h-9"/><path d="M7 8h4M9.8 6.6L11.2 8 9.8 9.4"/></svg>queue</span>
    <span><i class="sw" style="border-color:var(--warn);border-style:dashed"></i>not declared</span>
    <span>- - snapshot</span>  </span>
</div>
<div id="problems" hidden></div>
<div id="main" style="position:relative">
  <svg id="svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="var(--link)"/>
      </marker>
      <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="var(--accent)"/>
      </marker>
    </defs>
    <g id="root"></g>
  </svg>
  <div id="empty" hidden>No queues or services yet.<br>Start with <code>!ChronicleServicesCfg { queues: { }, services: { } }</code></div>
</div>
<div id="toast" hidden></div>
<div id="menu" hidden></div>

<script>
  /*BRIDGE*/
  if (!window.host) window.host = m => console.log('host:', m);   // opened outside the IDE
  const DARK = /*DARK*/false;
  if (DARK) document.documentElement.classList.add('dark');


  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const NW = 214, BASE_H = 44, BUILDER_H = 58, GAP_Y = 22;
  const svg = $('svg'), g = $('root');
  // Layout choices: dir 'lr' (left to right) or 'tb' (top to bottom); style 'boxes' (queues are nodes) or 'arrows'
  // (only services are nodes, and each queue is a labelled arrow from its writer to its readers)
  const view = { dir: 'tb', style: 'arrows' };
  const SAVED_VIEW = /*VIEW*/null;   // the IDE fills this in from its settings
  if (SAVED_VIEW) Object.assign(view, SAVED_VIEW);
  view.style = 'arrows';   // queues are always drawn as arrows (the queues-as-nodes graph is still built to work out focus views)

  let DATA = null, nodes = new Map(), edges = [], selected = null, pendingSelect = null;
  let matches = [], current = -1;   // search results, in column order, and the one Enter last moved to
  let focus = null;                 // { id, mode: 'flow' | 'direct', prevId }: show only what's connected to one node
  // autoFit: the view is "fit to window" and follows resizes; panning or zooming by hand turns it off, Fit turns it on
  let tx = 20, ty = 20, k = 1, fitted = false, autoFit = true;

  const send = (kind, ...fields) => window.host(kind + fields.join('\t'));

  // ---------- model → graph ----------

  /** Keys are matched loosely, so replicaSets / replicateSets and master / masterId all work. */
  function builderInfo(b) {
    if (!b) return null;
    const find = re => b.entries.find(e => re.test(e.key));
    const roll = find(/^rollCycle$/i), sets = b.entries.find(e => /replica/i.test(e.key) && e.kind === 'list'),
          master = find(/^master/i);
    const setNames = sets ? sets.items : [];
    return { roll, sets, master, setNames,
             masterOk: !master || !master.value || setNames.length === 0 || setNames.includes(master.value),
             others: b.entries.filter(e => e !== roll && e !== sets && e !== master) };
  }

  /** Builds the graph, keeping only the node ids in {@code keep} when it's given. */
  function buildGraph(keep) {
    nodes = new Map(); edges = [];
    const add = n => { if (!keep || keep.has(n.id)) nodes.set(n.id, n); };
    for (const q of DATA.queues) add({ id: 'q:' + q.name, kind: 'q', d: q, b: builderInfo(q.builder), ins: [], outs: [] });
    for (const s of DATA.services) add({ id: 's:' + s.name, kind: 's', d: s, ins: [], outs: [] });
    const edge = (from, to, type) => {
      const a = nodes.get(from), b = nodes.get(to);
      if (!a || !b) return;
      const e = { a, b, type, back: false };
      edges.push(e); a.outs.push(e); b.ins.push(e);
    };
    for (const s of DATA.services) {
      s.inputs.forEach(q => edge('q:' + q, 's:' + s.name, 'in'));
      if (s.output) edge('s:' + s.name, 'q:' + s.output, 'out');
      if (s.snapshot) edge('q:' + s.snapshot, 's:' + s.name, 'snap');   // read back on restart
    }
  }

  /**
   * The "arrows" style: services are the nodes, and a queue becomes an arrow, labelled with its name, from the service
   * that writes it to each service that reads it. A queue that nothing writes or nothing reads has no service at
   * one end, so it's drawn as a small pill node (id q:name) at that end.
   */
  function buildArrowGraph(keep) {
    nodes = new Map(); edges = [];
    const kept = id => !keep || keep.has(id);
    const services = DATA.services.filter(s => kept('s:' + s.name));
    for (const s of services) nodes.set('s:' + s.name, { id: 's:' + s.name, kind: 's', d: s, ins: [], outs: [] });
    const edge = (a, b, type, q) => { const e = { a, b, type, q, back: false }; edges.push(e); a.outs.push(e); b.ins.push(e); };
    for (const q of DATA.queues) {
      if (!kept('q:' + q.name)) continue;
      const writers = services.filter(s => s.output === q.name).map(s => nodes.get('s:' + s.name));
      const readers = services.filter(s => s.inputs.includes(q.name)).map(s => nodes.get('s:' + s.name));
      let from = writers, to = readers;
      if (!writers.length || !readers.length) {
        const pill = { id: 'q:' + q.name, kind: 'q', pill: true, d: q, b: builderInfo(q.builder), ins: [], outs: [] };
        nodes.set(pill.id, pill);
        if (!writers.length) from = [pill]; else to = [pill];
      }
      for (const a of from) for (const b of to) edge(a, b, 'q', q);
      // A snapshot queue read back by its own writer adds nothing to the picture; one read by another service does
      for (const s of services) {
        if (s.snapshot === q.name && !from.some(a => a.d === s)) for (const a of from) edge(a, nodes.get('s:' + s.name), 'snap', q);
      }
    }
  }

  function layout() {
    const all = [...nodes.values()];
    const flow = e => e.type !== 'snap' && !e.back;
    // Break cycles: an edge back to a node still on the DFS stack is drawn but ignored for layering
    const state = new Map();
    const dfs = n => {
      state.set(n, 1);
      for (const e of n.outs) {
        if (e.type === 'snap') continue;
        const s = state.get(e.b);
        if (s === 1) e.back = true; else if (!s) dfs(e.b);
      }
      state.set(n, 2);
    };
    all.filter(n => !n.ins.some(e => e.type !== 'snap')).forEach(n => { if (!state.get(n)) dfs(n); });
    all.forEach(n => { if (!state.get(n)) dfs(n); });

    // Longest path from the sources
    const layer = new Map(), order = [];
    const visit = n => {
      if (layer.has(n)) return layer.get(n);
      layer.set(n, 0);
      let l = 0;
      for (const e of n.ins) if (flow(e)) l = Math.max(l, visit(e.a) + 1);
      layer.set(n, l); order.push(n);
      return l;
    };
    all.forEach(visit);
    // Sources sit just left of their first consumer instead of in column 0
    for (const n of all) {
      if (n.ins.some(flow)) continue;
      const next = n.outs.filter(flow).map(e => layer.get(e.b));
      if (next.length) layer.set(n, Math.max(0, Math.min(...next) - 1));
    }

    // ---- Order within each layer so that as few arrows as possible cross (Sugiyama-style) ----
    // An arrow that skips layers gets a waypoint in each layer it passes through. The waypoint takes part in the
    // ordering like a node, and keeps a lane free that the arrow is then drawn along (see route).
    const L = Math.max(0, ...all.map(n => layer.get(n))) + 1;
    const layers = Array.from({ length: L }, () => []);
    const up = new Map(), down = new Map();   // item → its neighbours in the layer above / below
    const addItem = (it, l) => { layers[l].push(it); up.set(it, []); down.set(it, []); };
    const link = (u, v) => { if (!down.get(u).includes(v)) { down.get(u).push(v); up.get(v).push(u); } };
    // Starting order: depth-first from the sources, so things that are connected start out near each other
    const placed = new Set();
    const place = n => {
      if (placed.has(n)) return;
      placed.add(n); addItem(n, layer.get(n));
      n.outs.filter(flow).forEach(e => place(e.b));
    };
    all.filter(n => !n.ins.some(flow)).forEach(place);
    all.forEach(place);
    // Waypoints. Arrows that leave the same node for the same queue share them until they part.
    const shared = new Map();
    for (const e of edges) {
      e.via = [];
      const la = layer.get(e.a), lb = layer.get(e.b);
      if (!flow(e) || lb <= la) continue;
      let prev = e.a;
      for (let l = la + 1; l < lb; l++) {
        const key = e.a.id + '|' + (e.q ? e.q.name : '') + '@' + l;
        let d = shared.get(key);
        if (!d) { d = { dummy: true }; shared.set(key, d); addItem(d, l); }
        link(prev, d); e.via.push(d); prev = d;
      }
      link(prev, e.b);
    }

    const pos = new Map();
    const index = () => layers.forEach(c => c.forEach((it, i) => pos.set(it, i)));
    const crossingsBetween = l => {   // arrow crossings between layer l and l + 1
      const segs = [];
      for (const u of layers[l]) for (const v of down.get(u)) segs.push([pos.get(u), pos.get(v)]);
      let c = 0;
      for (let i = 0; i < segs.length; i++) for (let j = i + 1; j < segs.length; j++) {
        if ((segs[i][0] - segs[j][0]) * (segs[i][1] - segs[j][1]) < 0) c++;
      }
      return c;
    };
    const crossings = () => { let c = 0; for (let l = 0; l + 1 < L; l++) c += crossingsBetween(l); return c; };
    const median = list => {
      const p = list.map(m => pos.get(m)).sort((a, b) => a - b), m = p.length >> 1;
      return !p.length ? null : p.length % 2 ? p[m] : (p[m - 1] + p[m]) / 2;
    };
    const sortLayer = (l, byAbove) => {   // by the median position of each item's neighbours on one side
      const c = layers[l], key = new Map();
      c.forEach((it, i) => { const m = median((byAbove ? up : down).get(it)); key.set(it, m === null ? i : m); });
      c.sort((a, b) => key.get(a) - key.get(b) || pos.get(a) - pos.get(b));
      c.forEach((it, i) => pos.set(it, i));
    };
    // Crossings among u's and v's arrows (both sides) when u is placed before v
    const pairCrossings = (u, v) => {
      let c = 0;
      for (const side of [up, down]) for (const a of side.get(u)) for (const b of side.get(v)) if (pos.get(a) > pos.get(b)) c++;
      return c;
    };
    const transpose = () => {   // swap neighbours while that removes crossings
      for (let round = 0, better = true; better && round < 20; round++) {
        better = false;
        for (const c of layers) for (let i = 0; i + 1 < c.length; i++) {
          const u = c[i], v = c[i + 1];
          if (pairCrossings(u, v) > pairCrossings(v, u)) { c[i] = v; c[i + 1] = u; pos.set(v, i); pos.set(u, i + 1); better = true; }
        }
      }
    };
    // The sweeps can settle in a local best, so start them from several orders and keep the overall best:
    // the depth-first order, its mirror image, and a few fixed shuffles (seeded, so the same YAML always gives
    // the same picture). Bigger diagrams get fewer starts, to keep the layout quick.
    const initial = layers.map(c => c.slice());
    let seed = 1;
    const shuffled = c => {
      const s = c.slice();
      for (let i = s.length - 1; i > 0; i--) { seed = (seed * 16807) % 2147483647; const j = seed % (i + 1); [s[i], s[j]] = [s[j], s[i]]; }
      return s;
    };
    const items = layers.reduce((s, c) => s + c.length, 0);
    const starts = [initial, initial.map(c => c.slice().reverse())];
    for (let k = 0, extra = items > 300 ? 0 : items > 120 ? 2 : 6; k < extra; k++) starts.push(initial.map(shuffled));
    let best = null, bestCrossings = Infinity;
    for (const start of starts) {
      start.forEach((c, l) => { layers[l] = c.slice(); });
      index();
      transpose();
      let c = crossings();
      if (c < bestCrossings) { bestCrossings = c; best = layers.map(c2 => c2.slice()); }
      for (let iter = 0; iter < 24 && bestCrossings > 0; iter++) {
        if (iter % 2 === 0) for (let l = 1; l < L; l++) sortLayer(l, true);
        else for (let l = L - 2; l >= 0; l--) sortLayer(l, false);
        transpose();
        c = crossings();
        if (c < bestCrossings) { bestCrossings = c; best = layers.map(c2 => c2.slice()); }
      }
      if (bestCrossings === 0) break;
    }
    best.forEach((c, l) => { layers[l] = c; });
    index();
    window.layoutCrossings = bestCrossings;   // for checking the layout from the console

    // ---- Positions across each layer: keep the order and spacing, and line items up with their neighbours ----
    all.forEach(n => { n.w = width(n); n.h = height(n); });
    const lr = view.dir === 'lr';
    const breadth = it => it.dummy ? 0 : lr ? it.h : it.w;
    const minDist = (a, b) => breadth(a) / 2 + breadth(b) / 2 + (a.dummy || b.dummy ? 18 : lr ? GAP_Y : 36);
    const center = new Map();
    layers.forEach(c => {   // start packed and centred on 0
      let p = 0;
      c.forEach((it, i) => { if (i) p += minDist(c[i - 1], it); center.set(it, p); });
      c.forEach(it => center.set(it, center.get(it) - p / 2));
    });
    const relax = (c, side) => {
      const want = c.map(it => {
        const nb = side.get(it);
        return nb.length ? nb.reduce((s, m) => s + center.get(m), 0) / nb.length : center.get(it);
      });
      // Pack once pushing right and once pushing left from the wanted spots, then take the average: both keep the
      // spacing, so their average does too, and it doesn't drift to one side.
      const f = want.slice(), b = want.slice();
      for (let i = 1; i < c.length; i++) f[i] = Math.max(f[i], f[i - 1] + minDist(c[i - 1], c[i]));
      for (let i = c.length - 2; i >= 0; i--) b[i] = Math.min(b[i], b[i + 1] - minDist(c[i], c[i + 1]));
      c.forEach((it, i) => center.set(it, (f[i] + b[i]) / 2));
    };
    for (let pass = 0; pass < 8; pass++) {
      if (pass % 2 === 0) for (let l = 1; l < L; l++) relax(layers[l], up);
      else for (let l = L - 2; l >= 0; l--) relax(layers[l], down);
    }

    // ---- Layers become columns (left to right) or rows (top to bottom) ----
    // The gap after a layer leaves room for the queue tags that sit just past its services (see labelAt).
    const real = c => c.filter(it => !it.dummy);
    const tagExtent = (c, dim) => Math.max(0, ...real(c).flatMap(n => n.outs.filter(hasLabel).map(e => labelSize(e.q)[dim])));
    let at = 0;
    layers.forEach(c => {
      if (lr) {
        const colW = Math.max(0, ...real(c).map(n => n.w));
        c.forEach(it => {
          const cy = center.get(it);
          if (it.dummy) { it.p1 = [at, cy]; it.p2 = [at + colW, cy]; } else { it.x = at + (colW - it.w) / 2; it.y = cy - it.h / 2; }
        });
        const tags = tagExtent(c, 0);
        at += colW + Math.max(96, tags ? LABEL_GAP + tags + 56 : 0);
      } else {
        const rowH = Math.max(0, ...real(c).map(n => n.h));
        c.forEach(it => {
          const cx = center.get(it);
          if (it.dummy) { it.p1 = [cx, at]; it.p2 = [cx, at + rowH]; } else { it.x = cx - it.w / 2; it.y = at + (rowH - it.h) / 2; }
        });
        const tags = tagExtent(c, 1);
        at += rowH + Math.max(56, tags ? LABEL_GAP + tags + 40 : 0);
      }
    });
  }

  /**
   * The path of an arrow from {@code from} (its writer, or the queue tag it passes through) to its reader, along the
   * lane the layout kept for it when it skips layers. If either end was dragged, the lane no longer fits: go direct.
   */
  function route(from, e) {
    const movedHere = manual.get(viewKey());
    if (!e.via || !e.via.length || (movedHere && (movedHere.has(e.a.id) || movedHere.has(e.b.id)))) return curve({ a: from, b: e.b }).d;
    const lr = view.dir === 'lr';
    let p = lr ? [from.x + from.w, from.y + from.h / 2] : [from.x + from.w / 2, from.y + from.h];
    let d = `M${p[0]},${p[1]}`;
    const bend = q => {   // smooth S-bend from p to q, leaving and arriving along the flow direction
      const m = lr ? (p[0] + q[0]) / 2 : (p[1] + q[1]) / 2;
      d += lr ? ` C${m},${p[1]} ${m},${q[1]} ${q[0]},${q[1]}` : ` C${p[0]},${m} ${q[0]},${m} ${q[0]},${q[1]}`;
      p = q;
    };
    for (const w of e.via) { bend(w.p1); d += ` L${w.p2[0]},${w.p2[1]}`; p = w.p2; }
    bend(lr ? [e.b.x - 2, e.b.y + e.b.h / 2] : [e.b.x + e.b.w / 2, e.b.y - 2]);
    return d;
  }

  // Queue tags (arrows style): one per queue, on the writer's outgoing arrow, just past the writer's edge
  const LABEL_GAP = 10;
  const hasLabel = e => e.type === 'q' && !e.a.pill && !e.b.pill;
  function labelLine2(queue) {
    const b = builderInfo(queue.builder);
    return b ? '⟳ ' + (b.roll ? b.roll.value : '—') + (b.master ? '  ★ ' + b.master.value : '') : '';
  }
  function labelSize(queue) {
    const line2 = labelLine2(queue);
    return [Math.max(queue.name.length * 6.8 + 15, line2.length * 5.9) + 16, line2 ? 32 : 19];   // +15: the icon
  }
  /** The centre of a writer's queue tag: right of it (left to right) or below it (top to bottom), clear of the box. */
  function labelAt(writer, queue) {
    const [w, h] = labelSize(queue), [ox, oy] = tagOffset(writer, queue);   // offset: where the user dragged it
    return view.dir === 'lr' ? [writer.x + writer.w + LABEL_GAP + w / 2 + ox, writer.y + writer.h / 2 + oy]
                             : [writer.x + writer.w / 2 + ox, writer.y + writer.h + LABEL_GAP + h / 2 + oy];
  }

  const height = n => n.pill ? (n.b ? 44 : 30) : BASE_H + (n.kind === 'q' && n.b ? BUILDER_H : 0);
  const width = n => n.pill ? Math.max(120, 40 + n.d.name.length * 7) : NW;

  // ---------- drawing ----------

  function el(name, attrs, parent, text) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  const clip = (s, n) => s == null ? '' : s.length > n ? s.slice(0, n - 1) + '…' : s;
  const prop = (n, key) => (n.d.props || []).find(p => p.key === key);

  function render() {
    g.textContent = '';
    const edgeLayer = el('g', {}, g), nodeLayer = el('g', {}, g), labelLayer = el('g', {}, g);
    const q = $('search').value.trim().toLowerCase();
    const labelled = new Set();   // one label per queue per writer, so a fan-out doesn't repeat it on every branch
    const arrow = (d, cls, hot, head) => el('path', { d, class: 'edge' + cls + (hot ? ' hot' : ''),
        'marker-end': head ? (hot ? 'url(#arrow-hot)' : 'url(#arrow)') : 'none' }, edgeLayer);
    for (const e of edges) {
      const qid = e.q ? 'q:' + e.q.name : null;
      const hot = selected && (e.a.id === selected || e.b.id === selected || qid === selected);
      if (hasLabel(e)) {
        // Arrows go through the queue's tag: one stem from the writer to the tag, then a branch to each reader.
        // In its default place the tag sits just past the writer and hides the stem; dragged away, the stem shows.
        const pt = labelAt(e.a, e.q), tag = { x: pt[0], y: pt[1], w: 0, h: 0 };
        const key = e.a.id + '>' + e.q.name;
        if (!labelled.has(key)) {
          labelled.add(key);
          const stemHot = selected && (e.a.id === selected || qid === selected);
          arrow(curve({ a: e.a, b: tag }).d, '', stemHot, false);
          drawLabel(e.q, pt, labelLayer, stemHot, q, e.a);
        }
        arrow(route(tag, e), '', hot, true);
        continue;
      }
      arrow(route(e.a, e), e.type === 'snap' ? ' snap' : '', hot, true);
    }
    for (const n of nodes.values()) drawNode(n, nodeLayer);
    renderSummary();
  }

  /** The path of an edge, with its midpoint and a point near its start (for labels). */
  function curve(e) {
    const a = e.a, b = e.b;
    let p;
    if (view.dir === 'lr') {
      if (b.x > a.x) {
        const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x - 2, y2 = b.y + b.h / 2, c = Math.max(40, (x2 - x1) / 2);
        p = [x1, y1, x1 + c, y1, x2 - c, y2, x2, y2];
      } else {   // backward (cycle or snapshot): loop below, or above for nodes in the upper half, clear of neighbours
        const below = a.y + a.h / 2 >= 0, s = below ? 1 : -1, drop = s * (40 + Math.abs(a.x - b.x) * 0.08);
        const x1 = a.x + a.w / 2, y1 = below ? a.y + a.h : a.y, x2 = b.x + b.w / 2 + 12, y2 = below ? b.y + b.h + 2 : b.y - 2;
        p = [x1, y1, x1, y1 + drop, x2, y2 + drop, x2, y2];
      }
    } else {
      if (b.y > a.y) {
        const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y - 2, c = Math.max(30, (y2 - y1) / 2);
        p = [x1, y1, x1, y1 + c, x2, y2 - c, x2, y2];
      } else {   // backward: loop round the outer side (the side away from the middle of the diagram), clear of neighbours
        const right = a.x + a.w / 2 >= 0, s = right ? 1 : -1, out = s * (50 + Math.abs(a.y - b.y) * 0.1);
        const x1 = right ? a.x + a.w : a.x, y1 = a.y + a.h / 2, x2 = right ? b.x + b.w + 2 : b.x - 2, y2 = b.y + b.h / 2 + 8;
        p = [x1, y1, x1 + out, y1, x2 + out, y2, x2, y2];
      }
    }
    const at = t => { const u = 1 - t; return [u*u*u*p[0] + 3*u*u*t*p[2] + 3*u*t*t*p[4] + t*t*t*p[6], u*u*u*p[1] + 3*u*u*t*p[3] + 3*u*t*t*p[5] + t*t*t*p[7]]; };
    return { d: `M${p[0]},${p[1]} C${p[2]},${p[3]} ${p[4]},${p[5]} ${p[6]},${p[7]}`, mid: at(0.5), near: at(0.22) };
  }

  /** A queue's name on its arrow: a small rounded tag, with its roll cycle and master when it has a builder. */
  function drawLabel(queue, [cx, cy], parent, hot, search, writer) {
    const b = builderInfo(queue.builder), line2 = labelLine2(queue), [w, h] = labelSize(queue);
    const match = search && (queue.name.toLowerCase().includes(search) || JSON.stringify(queue).toLowerCase().includes(search));
    const id = 'q:' + queue.name;
    const grp = el('g', { class: 'qlabel' + (hot ? ' hot' : '') + (match ? ' match' : '') + (!queue.declared ? ' undeclared' : '')
        + (selected === id ? ' selected' : ''), transform: `translate(${cx - w / 2},${cy - h / 2})` }, parent);
    el('rect', { width: w, height: h, rx: 6 }, grp);
    // pipe icon, then the name, centred together on the first line
    const nameW = queue.name.length * 6.8, start = (w - nameW - 15) / 2;
    icon(grp, 'queue', start, 3, 12);
    el('text', { x: start + 15, y: 13, class: 'qname' }, grp, queue.name);
    if (line2) el('text', { x: w / 2, y: 26, 'text-anchor': 'middle', class: 'qsub' + (b.masterOk ? '' : ' warn') }, grp, line2);
    grp.addEventListener('mousedown', ev => startTagDrag(writer, queue, ev));
    grp.addEventListener('click', ev => { if (moved) return; ev.stopPropagation(); if (ev.ctrlKey || ev.metaKey) send('G', id); else select(id); });
    grp.addEventListener('contextmenu', ev => {
      ev.preventDefault(); ev.stopPropagation(); select(id);
      openMenu([['Show Upstream & Downstream', 'Only the services and queues around this queue', () => setFocus(id, 'flow')],
                ['Show Direct Connections', 'Only the services that read or write it', () => setFocus(id, 'direct')],
                null, ['Show in YAML', null, () => send('G', id)]], ev.clientX, ev.clientY);
    });
  }

  // 16×16 stroke icons: a gear for a service, a pipe (events flowing through) for a queue
  const ICONS = {
    service: '<circle cx="8" cy="8" r="2.2"/><circle cx="8" cy="8" r="4.6"/>'
        + '<path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/>',
    queue: '<ellipse cx="3.5" cy="8" rx="1.8" ry="4"/><path d="M3.5 4h9c1 0 1.8 1.8 1.8 4s-.8 4-1.8 4h-9"/>'
        + '<path d="M7 8h4M9.8 6.6L11.2 8 9.8 9.4"/>',
  };

  /** Draws an icon at (x, y), {@code size} pixels square, in the service or queue colour. */
  function icon(parent, kind, x, y, size = 16) {
    const g = el('g', { class: 'icon', transform: `translate(${x},${y}) scale(${size / 16})`,
                        style: `color:var(--${kind === 'service' ? 'svc' : 'queue'}-stroke)` }, parent);
    g.innerHTML = ICONS[kind];
    return g;
  }

  function drawNode(n, parent) {
    const isQ = n.kind === 'q';
    const cls = 'node ' + (isQ ? 'queue' : 'svc') + (isQ && !n.d.declared ? ' undeclared' : '') + (selected === n.id ? ' selected' : '')
        + (matches.includes(n) ? ' match' : '') + (current >= 0 && matches[current] === n ? ' current' : '')
        + (focus && focus.id === n.id ? ' root' : '');
    const grp = el('g', { class: cls, transform: `translate(${n.x},${n.y})`, 'data-id': n.id }, parent);
    el('rect', { class: 'box', width: n.w, height: n.h, rx: n.pill ? 15 : isQ ? 14 : 4 }, grp);
    if (n.pill) {   // a queue with no writer or no reader, in the arrows style
      icon(grp, 'queue', 10, 7);
      el('text', { class: 'title', x: 30, y: 19 }, grp, n.d.name);
      if (n.b) el('text', { class: 'sub' + (n.b.masterOk ? '' : ' warn'), x: 30, y: 35 }, grp,
          '⟳ ' + (n.b.roll ? n.b.roll.value : '—') + (n.b.master ? '  ★ ' + n.b.master.value : ''));
      nodeEvents(n, grp);
      return;
    }
    icon(grp, isQ ? 'queue' : 'service', 9, 7);
    el('text', { class: 'title', x: 30, y: 19 }, grp, clip(n.d.name, 26));
    let sub;
    if (isQ) {
      const path = prop(n, 'path');
      sub = !n.d.declared ? 'not declared in queues' : path ? path.value : '';
    } else {
      const impl = prop(n, 'implClass');
      sub = impl ? impl.value.split('.').pop() : n.d.inputs.length ? '' : 'source (no inputs)';
    }
    el('text', { class: 'sub' + (isQ && !n.d.declared ? ' warn' : ''), x: 30, y: 35 }, grp, clip(sub, 30));

    if (isQ && n.b) {
      const b = n.b, y0 = BASE_H;
      el('line', { class: 'sep', x1: 0, x2: NW, y1: y0, y2: y0 }, grp);
      el('text', { class: 'sub', x: 10, y: y0 + 15 }, grp, clip(n.d.builder.type || 'builder', 32));
      const line2 = el('text', { x: 10, y: y0 + 32 }, grp);
      el('tspan', {}, line2, '⟳ ' + (b.roll ? clip(b.roll.value, 16) : '—'));
      if (b.master) el('tspan', { dx: 14, class: b.masterOk ? '' : 'warn' }, line2, '★ ' + clip(b.master.value, 10) + (b.masterOk ? '' : ' ⚠'));
      const sets = b.sets ? b.sets.key + ': [' + b.setNames.join(', ') + ']' : b.others.length ? b.others.map(e => e.key).join(', ') : '';
      el('text', { class: 'sub', x: 10, y: y0 + 49 }, grp, clip(sets, 32));
    }
    nodeEvents(n, grp);
  }

  function nodeEvents(n, grp) {
    grp.addEventListener('mousedown', e => startNodeDrag(n, e));
    grp.addEventListener('click', e => {
      if (moved) return;
      e.stopPropagation();
      if (e.ctrlKey || e.metaKey) { send('G', n.id); return; }
      select(n.id);
    });
    grp.addEventListener('dblclick', e => { e.stopPropagation(); startRename(n, grp); });
    grp.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      select(n.id);
      nodeMenu(n, grp, e.clientX, e.clientY);
    });
  }

  // ---------- focus: show only what's connected to one node ----------

  /**
   * Ids to keep for a focus view, worked out on the full graph.
   * flow:   the node, everything upstream of it (what feeds it, transitively) and everything downstream (what it feeds).
   * direct: the node, its queues (a queue: its services), and for a service also the other services on those queues.
   */
  function connectedIds(id, mode) {
    const root = nodes.get(id), keep = new Set([id]);
    if (mode === 'direct') {
      const near = n => [...n.ins.map(e => e.a), ...n.outs.map(e => e.b)];
      for (const m of near(root)) {
        keep.add(m.id);
        if (root.kind === 's') near(m).forEach(x => keep.add(x.id));
      }
      return keep;
    }
    // Upstream and downstream are walked separately, so that siblings (other readers of an upstream queue) stay out
    const walk = (start, dir) => {
      const seen = new Set([start]);
      const go = n => {
        for (const e of dir > 0 ? n.outs : n.ins) {
          if (e.type === 'snap') continue;
          const m = dir > 0 ? e.b : e.a;
          if (!seen.has(m)) { seen.add(m); keep.add(m.id); go(m); }
        }
      };
      go(start);
    };
    walk(root, 1);
    walk(root, -1);
    root.ins.concat(root.outs).filter(e => e.type === 'snap').forEach(e => keep.add(e.a.id).add(e.b.id));
    return keep;
  }

  /** Builds and lays out the graph for the current data, applying the focus view if there is one. */
  function rebuild() {
    buildGraph(null);   // the full queues-and-services graph: focus is always worked out on it
    if (focus && !nodes.has(focus.id)) focus = null;   // its node was removed or renamed in the YAML
    const keep = focus ? connectedIds(focus.id, focus.mode) : null;
    const name = focus ? nodes.get(focus.id).d.name : '';
    if (view.style === 'arrows') buildArrowGraph(keep); else if (keep) buildGraph(keep);
    layout();
    applyManualPositions();
    $('focus').hidden = !focus;
    if (focus) {
      const shown = keep.size, total = DATA.queues.length + DATA.services.length;
      $('focus-text').textContent = (focus.mode === 'flow' ? 'Upstream & downstream of ' : 'Direct connections of ')
          + name + ` (${shown} of ${total})`;
    }
  }

  function setFocus(id, mode) {
    focus = id ? { id, mode } : null;
    rebuild();
    runSearch();
    render();
    fit();
  }

  // ---------- context menu ----------

  function nodeMenu(n, grp, x, y) {
    const what = n.kind === 's' ? 'service' : 'queue';
    const items = [
      ['Show Upstream & Downstream', `Only the ${what}s and queues this ${what} depends on or feeds`, () => setFocus(n.id, 'flow')],
      ['Show Direct Connections', n.kind === 's' ? 'Only its own queues and the services on them' : 'Only the services that read or write it',
        () => setFocus(n.id, 'direct')],
    ];
    if (focus) items.push(null, ['Show All', 'Every service and queue again', () => setFocus(null)]);
    items.push(null, ['Show in YAML', null, () => send('G', n.id)], ['Rename…', null, () => startRename(n, grp)]);
    openMenu(items, x, y);
  }

  function openMenu(items, x, y) {
    const m = $('menu');
    m.textContent = '';
    for (const it of items) {
      if (!it) { m.appendChild(document.createElement('hr')); continue; }
      const b = document.createElement('button');
      b.textContent = it[0];
      if (it[1]) { const s = document.createElement('small'); s.textContent = it[1]; b.appendChild(s); }
      b.onclick = () => { closeMenu(); it[2](); };
      m.appendChild(b);
    }
    m.hidden = false;
    const r = m.getBoundingClientRect();   // keep it inside the window
    m.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + 'px';
    m.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 4)) + 'px';
  }

  function closeMenu() { $('menu').hidden = true; }

  window.addEventListener('mousedown', e => { if (!$('menu').contains(e.target)) closeMenu(); }, true);
  window.addEventListener('blur', closeMenu);
  svg.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (focus) openMenu([['Show All', 'Every service and queue again', () => setFocus(null)]], e.clientX, e.clientY);
  });
  $('show-all').onclick = () => setFocus(null);

  function renderSummary() {
    const declared = DATA.queues.filter(q => q.declared).length, missing = DATA.queues.length - declared;
    $('summary').textContent = `${DATA.services.length} services · ${declared} queues` + (missing ? ` · ${missing} not declared` : '');
    $('problems').hidden = !DATA.problems.length;
    $('problems').textContent = DATA.problems.join(' ');
    $('empty').hidden = nodes.size > 0;
  }

  // ---------- selection ----------

  function select(id) {
    if (id && id !== selected) send('S', id);   // scroll the YAML beside the diagram to it
    selected = id;
    render();
  }

  // ---------- search ----------

  /** Everything a search looks at: the name, property keys and values, and the builder. */
  function searchText(n) {
    const d = n.d, parts = [d.name];
    (d.props || []).forEach(p => parts.push(p.key, p.value, ...p.items));
    if (n.kind === 'q' && d.builder) {
      parts.push(d.builder.type || '');
      d.builder.entries.forEach(p => parts.push(p.key, p.value, ...p.items));
    }
    return parts.join('\n').toLowerCase();
  }

  /** Recomputes the matches; keeps the current match if it still matches (after an edit or a text change). */
  function runSearch() {
    const q = $('search').value.trim().toLowerCase();
    const was = current >= 0 ? matches[current] && matches[current].id : null;
    matches = q ? [...nodes.values()].filter(n => searchText(n).includes(q)).sort((a, b) => a.x - b.x || a.y - b.y) : [];
    current = was ? matches.findIndex(n => n.id === was) : -1;
    const c = $('count');
    c.textContent = !q ? '' : !matches.length ? 'No matches'
        : current >= 0 ? `${current + 1} of ${matches.length}` : `${matches.length} match${matches.length > 1 ? 'es' : ''}`;
    c.classList.toggle('none', !!q && !matches.length);
  }

  function step(dir) {
    if (!matches.length) return;
    current = current < 0 ? (dir > 0 ? 0 : matches.length - 1) : (current + dir + matches.length) % matches.length;
    const n = matches[current];
    centerOn(n);
    select(n.id);
    runSearch();
    render();
  }

  function centerOn(n) {
    const r = svg.getBoundingClientRect();
    if (k < 0.8) k = 1;   // matches are hard to read at fit-to-window scale
    autoFit = false;
    tx = r.width / 2 - (n.x + n.w / 2) * k;
    ty = r.height / 2 - (n.y + n.h / 2) * k;
    applyTransform();
  }

  $('search').addEventListener('input', () => { current = -1; runSearch(); render(); });
  $('search').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
    if (e.key === 'Escape') { $('search').value = ''; current = -1; runSearch(); render(); e.stopPropagation(); }
  });
  // Esc outside the search box: close the menu, or leave the focus view
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || e.target.tagName === 'INPUT') return;
    if (!$('menu').hidden) closeMenu(); else if (focus) setFocus(null);
  });
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); $('search').focus(); $('search').select(); }
  });

  // ---------- rename ----------

  function rename(n, value) {
    const v = value.trim();
    if (!v || v === n.d.name) return;
    pendingSelect = n.kind + ':' + v;
    carryPositions(n.id, pendingSelect);
    if (focus && focus.id === n.id) { focus.prevId = n.id; focus.id = pendingSelect; }   // stay focused on it under its new name
    send('N', n.kind, n.d.name, v);
  }

  function startRename(n, grp) {
    const r = grp.querySelector('.box').getBoundingClientRect();
    const i = document.createElement('input');
    i.id = 'rename'; i.value = n.d.name; i.spellcheck = false;
    Object.assign(i.style, { left: r.left + 26 * k + 'px', top: r.top + 4 * k + 'px', width: Math.max(120, r.width - 34 * k) + 'px' });
    document.body.appendChild(i);
    i.focus(); i.select();
    let done = false;
    const finish = ok => { if (done) return; done = true; if (ok) rename(n, i.value); i.remove(); };
    i.onkeydown = e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); };
    i.onblur = () => finish(true);
  }

  // ---------- IDE → page ----------

  window.update = data => {
    DATA = data;
    rebuild();
    if (pendingSelect && nodes.has(pendingSelect)) selected = pendingSelect;
    pendingSelect = null;
    // a queue can be selected through its arrow label, so it needn't be a node
    if (selected && !nodes.has(selected) && !DATA.queues.some(q => 'q:' + q.name === selected)) selected = null;
    runSearch();
    render();
    if (!fitted || autoFit) fit();   // in fit mode, keep the whole diagram in view as it grows or shrinks
  };

  let toastTimer = 0;
  window.showError = msg => {
    pendingSelect = null;
    if (focus && focus.prevId) { focus.id = focus.prevId; focus.prevId = null; }   // the rename didn't happen
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.hidden = true, 5000);
  };

  // ---------- pan & zoom ----------

  function applyTransform() { g.setAttribute('transform', `translate(${tx},${ty}) scale(${k})`); }

  /** Zooms so the whole diagram fills the available space (up to 200%), and keeps doing so on resize. */
  function fit() {
    const r = svg.getBoundingClientRect();
    autoFit = true;
    if (!r.width || !r.height || !nodes.size) return;
    fitted = true;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of nodes.values()) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + n.w + 60); maxY = Math.max(maxY, n.y + n.h + 40);
    }
    const w = maxX - minX, h = maxY - minY;
    k = Math.max(0.05, Math.min(2, (r.width - 40) / w, (r.height - 40) / h));
    tx = (r.width - w * k) / 2 - minX * k;
    ty = (r.height - h * k) / 2 - minY * k;
    applyTransform();
  }

  // Window maximized or resized, or the divider dragged: refit in fit mode; otherwise keep the same point centred
  let lastW = 0, lastH = 0, resizeFrame = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      const r = svg.getBoundingClientRect();
      if (!r.width || !r.height) return;
      if (DATA && (autoFit || !fitted)) {
        fit();
      } else if (lastW && lastH) {
        tx += (r.width - lastW) / 2; ty += (r.height - lastH) / 2;
        applyTransform();
      }
      lastW = r.width; lastH = r.height;
    });
  }).observe(svg);
  $('fit').onclick = fit;
  // The IDE answers 'I' by reading the YAML again and calling window.update, which keeps moves, zoom and focus
  $('refresh').onclick = () => send('I');

  // Direction and queue-style toggles. The IDE stores the choice in its settings and passes it back in /*VIEW*/.
  function syncToggles() {
    document.querySelectorAll('[data-dir]').forEach(b => b.classList.toggle('on', b.dataset.dir === view.dir));
  }
  function setView(change) {
    Object.assign(view, change);
    send('V', view.dir, view.style);   // the IDE remembers it for next time
    syncToggles();
    if (!DATA) return;
    rebuild(); runSearch(); render(); fit();
  }
  document.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => setView({ dir: b.dataset.dir }));
  syncToggles();

  // Dragging empty space pans; dragging a node moves it (see startNodeDrag). Either way a drag isn't a click.
  // drag: what's being moved, { move(dx, dy) } with dx, dy in diagram units since the drag started
  let moved = false, dragging = false, sx = 0, sy = 0, drag = null;
  svg.addEventListener('mousedown', e => { if (e.button !== 0) return; dragging = true; moved = false; sx = e.clientX; sy = e.clientY; });
  window.addEventListener('mouseup', () => {
    if (drag && moved) $('reset').hidden = false;
    dragging = false; drag = null;
    svg.classList.remove('drag');
    setTimeout(() => moved = false, 0);
  });
  window.addEventListener('mousemove', e => {
    if (!dragging && !drag) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; svg.classList.add('drag'); }
    if (!moved) return;
    if (drag) {
      drag.move(dx / k, dy / k);
      render();
    } else {
      tx += dx; ty += dy; sx = e.clientX; sy = e.clientY; autoFit = false; applyTransform();
    }
  });

  // ---------- moved nodes ----------

  // What the user moved, kept per layout and focus view (each has its own arrangement), for this session:
  // node id → [x, y], and 'tag:<writer id>><queue>' → [dx, dy], a queue tag's offset from its default place
  const manual = new Map();
  const viewKey = () => view.dir + '/' + view.style + (focus ? '|' + focus.mode + ':' + focus.id : '');
  const viewMoves = () => { const key = viewKey(); if (!manual.has(key)) manual.set(key, new Map()); return manual.get(key); };
  const tagId = (writer, queue) => 'tag:' + writer.id + '>' + queue.name;

  function tagOffset(writer, queue) {
    const saved = manual.get(viewKey());
    return (saved && saved.get(tagId(writer, queue))) || [0, 0];
  }

  function beginDrag(e, item) {
    if (e.button !== 0) return;
    e.stopPropagation();   // not a pan
    drag = item;
    moved = false; sx = e.clientX; sy = e.clientY;
  }

  function startNodeDrag(n, e) {
    const ox = n.x, oy = n.y;
    beginDrag(e, { move: (dx, dy) => { n.x = ox + dx; n.y = oy + dy; viewMoves().set(n.id, [n.x, n.y]); } });
  }

  function startTagDrag(writer, queue, e) {
    if (!writer) return;
    const id = tagId(writer, queue), [ox, oy] = tagOffset(writer, queue);
    beginDrag(e, { move: (dx, dy) => viewMoves().set(id, [ox + dx, oy + dy]) });
  }

  /** After the automatic layout: put back the nodes the user moved in this view. */
  function applyManualPositions() {
    const saved = manual.get(viewKey());
    if (saved) for (const [id, [x, y]] of saved) { const n = nodes.get(id); if (n) { n.x = x; n.y = y; } }
    $('reset').hidden = !saved || !saved.size;
  }

  /** A renamed node keeps its place, and so does a focus view on it. */
  function carryPositions(oldId, newId) {
    const oldQueue = oldId.slice(2), newQueue = newId.slice(2);
    for (const [key, saved] of [...manual]) {
      if (saved.has(oldId)) saved.set(newId, saved.get(oldId));
      for (const [id, off] of [...saved]) {   // tags of a renamed writer or of a renamed queue
        if (!id.startsWith('tag:')) continue;
        const [writer, queue] = id.slice(4).split('>');
        if (writer === oldId) saved.set('tag:' + newId + '>' + queue, off);
        if (oldId.startsWith('q:') && queue === oldQueue) saved.set('tag:' + writer + '>' + newQueue, off);
      }
      if (key.endsWith(':' + oldId)) manual.set(key.slice(0, -oldId.length) + newId, new Map(saved));
    }
  }

  $('reset').onclick = () => { manual.delete(viewKey()); rebuild(); render(); fit(); };
  svg.addEventListener('click', () => { if (!moved && selected) select(null); });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const nk = Math.min(3, Math.max(0.05, k * (e.deltaY < 0 ? 1.1 : 0.9)));
    tx = px - (px - tx) * nk / k; ty = py - (py - ty) * nk / k; k = nk;
    autoFit = false;
    applyTransform();
  }, { passive: false });

  applyTransform();
  // The first diagram comes with the page. The IDE also sends fresh data once the page has loaded, because a
  // message sent from here during loading can be lost before the bridge is connected.
  const INITIAL = /*DATA*/null;
  if (INITIAL) window.update(INITIAL);
  send('I');
</script>
</body>
</html>
